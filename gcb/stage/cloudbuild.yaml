timeout: 14400s
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-token/versions/latest
      env: GITHUB_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/dockerhub-token/versions/latest
      env: DOCKERHUB_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/obs-password/versions/latest
      env: OBS_PASSWORD

steps:
  - name: gcr.io/cloud-builders/git
    dir: "go/src/k8s.io"
    args:
      - "clone"
      - "https://github.com/${_TOOL_ORG}/${_TOOL_REPO}"

  # Clone k/release
  - name: gcr.io/cloud-builders/git
    entrypoint: "bash"
    dir: "go/src/k8s.io/release"
    args:
      - "-c"
      - |
        git fetch
        echo "Checking out ${_TOOL_REF}"
        git checkout ${_TOOL_REF}

  # Download (or build) krel
  - name: gcr.io/k8s-staging-releng/k8s-cloud-builder:${_KUBE_CROSS_VERSION}
    dir: go/src/k8s.io/release
    env:
      - KREL_OUTPUT_PATH=/workspace/bin/krel
      - "TOOL_ORG=${_TOOL_ORG}"
      - "TOOL_REPO=${_TOOL_REPO}"
      - "TOOL_REF=${_TOOL_REF}"
      - "FORCE_BUILD_KREL=${_FORCE_BUILD_KREL}"
    args:
      - ./hack/get-krel

  # Build and stage the release artifacts
  - name: gcr.io/k8s-staging-releng/k8s-cloud-builder:${_KUBE_CROSS_VERSION}
    dir: "/workspace"
    env:
      - "TOOL_ORG=${_TOOL_ORG}"
      - "TOOL_REPO=${_TOOL_REPO}"
      - "TOOL_REF=${_TOOL_REF}"
      - "BUILD_ID=${BUILD_ID}"
      - "K8S_ORG=${_K8S_ORG}"
      - "K8S_REPO=${_K8S_REPO}"
      - "K8S_REF=${_K8S_REF}"
      - GOOGLE_SERVICE_ACCOUNT_NAME=krel-staging@k8s-releng-prod.iam.gserviceaccount.com
      - "KUBE_PARALLEL_BUILD_MEMORY=64"
    secretEnv:
      - GITHUB_TOKEN
      - DOCKERHUB_TOKEN
    args:
      - "bin/krel"
      - "stage"
      - "--submit=false"
      - "${_NOMOCK}"
      - "--log-level=${_LOG_LEVEL}"
      - "--type=${_TYPE}"
      - "--branch=${_RELEASE_BRANCH}"
      - "--build-version=${_BUILDVERSION}"

  # Sign and re-upload the attestations generated during the build. 
  - name: gcr.io/k8s-staging-releng/k8s-cloud-builder:${_KUBE_CROSS_VERSION}
    dir: "/workspace"
    args:
      - "bin/krel"
      - "sign"
      - "attestation"
      - "--in-place"
      - "--impersonate-service-account=krel-staging@k8s-releng-prod.iam.gserviceaccount.com"
      - "--log-level=${_LOG_LEVEL}"
      - "${_STAGE_BUCKET}/stage/${_BUILDVERSION}/provenance.json"

  # Stage the packages that will go to OBS
  - name: gcr.io/k8s-staging-releng/k8s-cloud-builder:${_KUBE_CROSS_VERSION}
    dir: "/workspace"
    env:
      - "TOOL_ORG=${_TOOL_ORG}"
      - "TOOL_REPO=${_TOOL_REPO}"
      - "TOOL_REF=${_TOOL_REF}"
      - "BUILD_ID=${BUILD_ID}"
      - "K8S_ORG=${_K8S_ORG}"
      - "K8S_REPO=${_K8S_REPO}"
      - "K8S_REF=${_K8S_REF}"
    secretEnv:
      - OBS_PASSWORD
    args:
      - "bin/krel"
      - "obs"
      - "stage"
      - "--submit=false"
      - "${_NOMOCK}"
      - "--log-level=${_LOG_LEVEL}"
      - "--type=${_TYPE}"
      - "--branch=${_RELEASE_BRANCH}"
      - "--build-version=${_BUILDVERSION}"

tags:
  - ${_GCP_USER_TAG}
  - ${_RELEASE_BRANCH}
  - ${_NOMOCK_TAG}
  - STAGE
  - ${_GIT_TAG}
  - ${_TYPE_TAG}
  - ${_MAJOR_VERSION_TAG}
  - ${_MINOR_VERSION_TAG}
  - ${_PATCH_VERSION_TAG}
  - ${_KUBERNETES_VERSION_TAG}

options:
  substitutionOption: ALLOW_LOOSE
  pool:
    name: "projects/$PROJECT_ID/locations/us-central1/workerPools/c3-highcpu-44"

substitutions:
  # _GIT_TAG will be filled with a git-based tag of the form vYYYYMMDD-hash, and
  # can be used as a substitution
  _GIT_TAG: "12345"

  # _STAGE_BUCKET is set by krel gcb to the mock or production bucket where
  # the artifacts are staged. We default to the mock bucket so that a job
  # submitted by hand can never touch production.
  _STAGE_BUCKET: "gs://5d7373bbdcb8270361b96548387bf2a9ad0d48758c35"
