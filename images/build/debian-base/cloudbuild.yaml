# See https://cloud.google.com/cloud-build/docs/build-config
timeout: 1500s

options:
  substitutionOption: ALLOW_LOOSE

steps:
  - name: 'registry.k8s.io/releng/gcb-docker-gcloud:v20260806'
    dir: ./images/build/debian-base
    env:
      - REGISTRY=$_REGISTRY
      - BUILD_IMAGE=debian-build
      - TAG=$_GIT_TAG
      - PULL_BASE_REF=$_PULL_BASE_REF
      - IMAGE_VERSION=$_IMAGE_VERSION
      - BASEIMAGE=$_BASEIMAGE
      - CONFIG=$_CONFIG
      - HOME=/root  # for docker buildx
    args:
    - make
    - manifest

substitutions:
  # _GIT_TAG will be filled with a git-based tag for the image, of the form vYYYYMMDD-hash, and
  # can be used as a substitution
  _GIT_TAG: '12345'
  _PULL_BASE_REF: 'dev'
  _IMAGE_VERSION: 'codename-v0.0.0'
  _CONFIG: 'codename'
  _BASEIMAGE: 'fakedebian:fake-slim'
  _REGISTRY: 'fake.repository/registry-name'

tags:
- 'debian-base'
- ${_GIT_TAG}
- ${_PULL_BASE_REF}
- ${_IMAGE_VERSION}
- ${_CONFIG}
