# CLOUD_SDK_VERSION: Bullseye has Python 3.9, and 553.0.0 is the last gcloud
# CLI release that supports it. Variants without it get the latest release.
# TODO: Review this once we drop bullseye.
variants:
  v1.38-cross1.27-trixie:
    CONFIG: 'cross1.27-trixie'
    KUBE_CROSS_VERSION: 'v1.38.0-go1.27.3-trixie.0'
  v1.38-cross1.27-bullseye:
    CONFIG: 'cross1.27'
    KUBE_CROSS_VERSION: 'v1.38.0-go1.27.3-bullseye.0'
    CLOUD_SDK_VERSION: '553.0.0'
  v1.37-cross1.26-bullseye:
    CONFIG: 'cross1.26'
    KUBE_CROSS_VERSION: 'v1.37.0-go1.26.10-bullseye.0'
    CLOUD_SDK_VERSION: '553.0.0'
  v1.36-cross1.26-bullseye:
    CONFIG: 'cross1.26'
    KUBE_CROSS_VERSION: 'v1.36.0-go1.26.10-bullseye.0'
    CLOUD_SDK_VERSION: '553.0.0'
  v1.35-cross1.26-bullseye:
    CONFIG: 'cross1.26'
    KUBE_CROSS_VERSION: 'v1.35.0-go1.26.10-bullseye.0'
    CLOUD_SDK_VERSION: '553.0.0'
  # Temporary: remove after 2026-10-27
  v1.34-cross1.26-bullseye:
